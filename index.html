<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F0F18">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..900&family=DM+Sans:opsz,wght@9..40,400..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <title>ClientOS</title>
    <style>
      body { background-color: #0F0F18; color: #e5e2db; }
      .stagger-item { opacity: 0; transform: translateY(10px); }
      .nav-item-enter { animation: navEnter 400ms cubic-bezier(0.19, 1, 0.22, 1) forwards; }
      @keyframes navEnter {
          to { opacity: 1; transform: translateY(0); }
      }
      .stat-card { transition: all 300ms ease; }
      .stat-card:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
    </style>
  </head>
  <body class="font-body-md text-body-md overflow-x-clip min-h-screen selection:bg-primary-container selection:text-on-primary-container m-0">
    <div id="app" class="w-full min-h-screen flex flex-col"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
